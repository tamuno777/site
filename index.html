<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Winnie Davis | Project Coordination, Business Analysis & IT Project Management</title>
<meta name="description" content="Winnie Davis: project coordination, business analysis and IT project management, with a software development background.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%237a1230'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3EW%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif&display=swap">
<style>
:root{--bg:#fff;--bg2:#faf4f5;--ink:#1d1517;--mute:#5f5155;--brand:#7a1230;--brand2:#f3e4e8;--on:#fff;--line:#eadde0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#150d10;--bg2:#1e1317;--ink:#f6eef0;--mute:#bba9ae;--brand:#b83a5d;--brand2:#2c1820;--line:#3a2229}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#150d10;--bg2:#1e1317;--ink:#f6eef0;--mute:#bba9ae;--brand:#b83a5d;--brand2:#2c1820;--line:#3a2229}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.w{max-width:1040px;margin:0 auto;padding:0 22px}
h1,h2,h3{font-family:"Instrument Serif",Georgia,"Times New Roman",serif;font-weight:400;line-height:1.1;margin:0}
h2{font-size:clamp(32px,4.8vw,42px);margin-bottom:10px}
section{padding:68px 0;border-top:1px solid var(--line)}
.alt{background:var(--bg2)}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);margin-bottom:10px}
.lead{color:var(--mute);max-width:62ch;margin:0 0 28px}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
nav b{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:26px;color:var(--brand)}
nav a{color:var(--ink);text-decoration:none;font-size:14px;font-weight:500;margin-left:18px}
nav a:hover{color:var(--brand)}
.hero{padding:54px 0 76px;border:0}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:40px;align-items:center}
h1{font-size:clamp(46px,7.5vw,72px);margin-bottom:14px}
.role{font-weight:600;color:var(--brand);margin-bottom:16px}
.btn{display:inline-block;padding:13px 24px;border-radius:999px;font-weight:600;text-decoration:none;font-size:15px;border:2px solid var(--brand);margin:6px 10px 0 0;cursor:pointer;font-family:inherit}
.btn.p{background:var(--brand);color:var(--on)}.btn.s{color:var(--brand);background:transparent}
.btn:hover{opacity:.88}
.panel{background:var(--brand);color:#fff;border-radius:22px;padding:30px}
.panel h3{font-size:20px;margin-bottom:14px}
.panel div{padding:10px 0;border-top:1px solid rgba(255,255,255,.28);font-size:15px}
.badge{display:inline-block;background:var(--brand2);color:var(--brand);font-size:13px;font-weight:600;padding:6px 14px;border-radius:999px;margin-bottom:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px 18px 18px 20px;border-left:4px solid var(--brand);font-weight:500}
.alt .card{background:var(--bg)}
.proj{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:30px}
.proj ul,.tools ul{padding-left:20px;margin:10px 0 0}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px}
.tags span{background:var(--brand2);color:var(--brand);padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600}
.links>a,.links>span{display:flex;justify-content:space-between;padding:13px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:500}
.links>a:hover{color:var(--brand)}.links>span{color:var(--mute)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}
.tools h3{font-size:17px;margin-bottom:4px;color:var(--brand)}
form{display:grid;gap:12px;max-width:560px}
input,textarea{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px}
footer{padding:28px 0;border-top:1px solid var(--line);color:var(--mute);font-size:14px}
.sr{position:absolute;left:-9999px}
.wide{overflow-x:auto}
@media(max-width:760px){.grid2{grid-template-columns:1fr}nav a.h{display:none}section{padding:52px 0}}
</style>
</head>
<body>
<div class="w">
<nav><b id="logo"></b><div><a class="h" href="#about">About</a><a class="h" href="#project">Project</a><a class="h" href="#toolkit">Toolkit</a><a href="#contact">Contact</a></div></nav>
</div>

<header class="hero"><div class="w grid2">
<div><div class="badge" id="avail"></div><h1 id="name"></h1><div class="role" id="role"></div><p class="lead" id="intro"></p>
<a class="btn p" href="#contact" id="cta1"></a><a class="btn s" href="#project" id="cta2"></a><a class="btn s" target="_blank" rel="noopener" href="Winnie_Davis_CV_PM_PC.pdf" download>Download CV</a></div>
<div class="panel"><h3>What I focus on</h3><div id="focus"></div></div>
</div></header>

<section class="alt" id="about"><div class="w">
<div class="eyebrow">Areas of interest</div><h2>Where I add value</h2><p class="lead" id="about-text"></p>
<div class="cards" id="areas"></div></div></section>

<section id="project"><div class="w">
<div class="eyebrow">Featured project</div><h2 id="p-title"></h2>
<div class="proj"><p class="lead" id="p-desc" style="margin-bottom:0"></p><div class="tags" id="p-tags"></div>
<a class="btn p" id="p-link" target="_blank" rel="noopener" style="margin:0"></a></div></div></section>

<section class="alt" id="toolkit"><div class="w">
<div class="eyebrow">Toolkit</div><h2>Tools &amp; technologies</h2><br>
<div class="tools" id="tools"></div></div></section>

<section><div class="w grid2" style="align-items:start">
<div><div class="eyebrow">Education</div><h2>Learning path</h2><div class="links" id="edu" style="margin-top:14px"></div></div>
<div><div class="eyebrow">My approach</div><h2>How I work</h2><p class="lead" id="approach" style="margin-top:12px"></p></div>
</div></section>

<section class="alt" id="contact"><div class="w grid2" style="align-items:start">
<div><div class="eyebrow">Contact</div><h2 id="c-title"></h2><p class="lead" id="c-text"></p><div id="socials"></div></div>
<form id="f"><label class="sr" for="n">Name</label><input id="n" name="name" placeholder="Your name" required>
<label class="sr" for="e">Email</label><input id="e" name="email" type="email" placeholder="Your email" required>
<label class="sr" for="m">Message</label><textarea id="m" name="message" rows="5" placeholder="How can I help?" required></textarea>
<button class="btn p" type="submit" style="margin:0">Send message</button><div id="st" role="status" style="color:var(--mute);font-size:14px"></div></form>
</div></section>

<footer><div class="w" id="foot"></div></footer>

<script>
/* ============ EDIT YOUR CONTENT HERE ============ */
const C = {
  name: "Winnie Davis",
  role: "Project Coordination | Business Analysis | IT Project Management",
  availability: "Open to project coordination and business analysis opportunities",
  intro: "I have a background in software development and a growing focus on project coordination, business analysis and IT project delivery. I’m interested in how projects move from an initial idea to a clearly defined plan and, ultimately, a successful outcome.",
  cta1: "Work with me", cta2: "See my project",
  focus: ["Project Coordination", "Business Analysis", "IT Project Management"],
  about: "My experience in technology has given me an understanding of how digital products are designed and developed, while my current MSc in Information Technology is building my understanding of IT systems, business processes and project delivery.",
  areas: [
    "Project Coordination and Project Management", "Business Requirements and Documentation",
    "Requirements Gathering and Analysis", "Work Breakdown Structures (WBS)",
    "Project Scheduling and Tracking", "Risk and Issue Management",
    "Stakeholder Communication", "User Acceptance Testing (UAT)", "Process Improvement and IT Systems"
  ],
  project: {
    title: "MediConnect Hospital Management System",
    description: "A self-directed IT project simulation for a proposed hospital management system, covering project planning, requirements documentation, risk management, stakeholder coordination and implementation planning.",
    tags: ["Project Planning", "Requirements Documentation", "Risk Management", "Stakeholder Coordination", "Implementation Planning"],
    githubUrl: "https://github.com/Ms-ibiso/mediconnect-hospital-management-system",
    githubLabel: "View project on GitHub →"
  },
  tools: {
    "Project Management": ["Jira", "Trello", "Microsoft Project"],
    "Documentation": ["Microsoft Word", "Excel", "Google Workspace"],
    "Process Mapping": ["Draw.io"],
    "Reporting & Analysis": ["Excel", "Power BI"],
    "Technical Background": ["React", "Next.js", "JavaScript", "TypeScript"]
  },
  education: [
    { label: "MSc Information Technology", sub: "MIVA Open University" },
    { label: "BSc Microbiology", sub: "University of Port Harcourt" }
  ],
  approach: "I value clear communication, structured planning, proper documentation and practical problem-solving. I enjoy understanding how systems work, identifying gaps in processes and helping organise the activities needed to move a project forward. I’m using this space to document my project work, practical exercises and learning in project coordination and business analysis.",
  contactTitle: "Let’s talk",
  contactText: "Have a project, role or collaboration in mind? Send a message and I’ll get back to you.",
  email: "Davisbeulah07@gmail.com",
  formEndpoint: "",   // optional: paste a Formspree URL (https://formspree.io/f/xxxx). Empty = opens your email app.
  socials: [          // leave url empty to hide
    { label: "LinkedIn", url: "https://linkedin.com/in/winnie-davis-1aa069246" },
    { label: "GitHub", url: "https://github.com/Ms-ibiso" }
  ]
};
/* ============ END OF EDITABLE CONTENT ============ */

const $ = id => document.getElementById(id);
const first = C.name.split(" ")[0];
document.title = C.name + " | " + C.role.replace(/ \| /g, ", ");
$("logo").textContent = C.name; $("name").textContent = C.name; $("role").textContent = C.role;
$("avail").textContent = C.availability; $("intro").textContent = C.intro;
$("cta1").textContent = C.cta1; $("cta2").textContent = C.cta2;
$("focus").innerHTML = C.focus.map(x => "<div>" + x + "</div>").join("");
$("about-text").textContent = C.about;
$("areas").innerHTML = C.areas.map(x => '<div class="card">' + x + "</div>").join("");
$("p-title").textContent = C.project.title; $("p-desc").textContent = C.project.description;
$("p-tags").innerHTML = C.project.tags.map(x => "<span>" + x + "</span>").join("");
$("p-link").href = C.project.githubUrl; $("p-link").textContent = C.project.githubLabel;
$("tools").innerHTML = Object.entries(C.tools).map(([k, v]) => "<div><h3>" + k + "</h3><div>" + v.join(", ") + "</div></div>").join("");
$("edu").innerHTML = C.education.map(e => "<span><span>" + e.label + "</span><span>" + e.sub + "</span></span>").join("");
$("approach").textContent = C.approach;
$("c-title").textContent = C.contactTitle; $("c-text").textContent = C.contactText;
$("socials").innerHTML = '<a class="btn s" href="mailto:' + C.email + '">' + C.email + "</a>" +
  C.socials.filter(s => s.url).map(s => '<a class="btn s" target="_blank" rel="noopener" href="' + s.url + '">' + s.label + "</a>").join("");
$("foot").textContent = "© " + new Date().getFullYear() + " " + C.name + ". All rights reserved.";

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target));
  if (C.formEndpoint) {
    try {
      const r = await fetch(C.formEndpoint, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify(d) });
      if (r.ok) { $("st").textContent = "Thanks, " + d.name + ". I’ll be in touch soon."; e.target.reset(); return; }
    } catch (_) {}
  }
  location.href = "mailto:" + C.email + "?subject=" + encodeURIComponent("Enquiry from " + d.name) +
    "&body=" + encodeURIComponent(d.message + "\n\n" + d.name + " (" + d.email + ")");
});
</script>
</body>
</html>
